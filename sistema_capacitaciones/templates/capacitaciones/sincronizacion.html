<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronización Offline - Sistema de Gestión</title>
    <style>
        /* Estilos básicos para la interfaz mobile-first */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* CSS para el Banner de Estado (Criterios 1, 2 y 3) */
        #status-banner {
            display: none; /* Oculto por defecto */
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        /* Clases dinámicas según el estado de conexión */
        .status-offline { background-color: #dc3545; } /* Rojo */
        .status-syncing { background-color: #ffc107; color: #333 !important; } /* Amarillo */
        .status-success { background-color: #28a745; } /* Verde */
    </style>
</head>
<body>

    <div class="container">
        <!-- Contenedor del estado de conexión -->
        <div id="status-banner"></div>

        <h2>Registro de Asistencia</h2>
        <p>Esta es la interfaz de carga (Frontend). Usa las herramientas de desarrollador para simular la caída de red.</p>
        
        <!-- Botón para simular que alguien guardó datos mientras no había internet -->
        <button onclick="simularGuardadoOffline()">Simular guardado offline (Llave RegCap + CUIL)</button>
    </div>

    <script>
        // ALCANCE: Parametrización del tipo de usuario
        const rolUsuarioActual = "Administrador"; 

        const banner = document.getElementById('status-banner');

        // CRITERIO 1: Visualizar estado de conexión (Cuando se cae la red)
        window.addEventListener('offline', () => {
            banner.style.display = 'block';
            banner.className = 'status-offline';
            banner.innerText = 'Sin conexión. Los registros se guardarán localmente.';
        });

        // CRITERIO 2: Estado positivo y Sincronización en curso (Cuando vuelve la red)
        window.addEventListener('online', async () => {
            banner.style.display = 'block';
            banner.className = 'status-syncing';
            banner.innerText = 'Conexión restablecida. Sincronización en curso...';
            
            // Disparamos la lógica de sincronización
            await ejecutarSincronizacion();
        });

        async function ejecutarSincronizacion() {
            // Verificación del ALCANCE: Solo Administrador/Desarrollador procesa el lote
            if (rolUsuarioActual !== "Administrador" && rolUsuarioActual !== "Desarrollador") {
                console.log("Usuario sin permisos para sincronizar lotes automáticos.");
                banner.style.display = 'none';
                return;
            }

            // CRITERIO DE ACEPTACIÓN 1: Iterar sobre LocalStorage recuperando solo llaves 'RegCap...'
            const llavesRegCap = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('RegCap')) {
                    llavesRegCap.push(key);
                }
            }

            if (llavesRegCap.length === 0) {
                console.log("No se encontraron lotes 'RegCap' pendientes de sincronización.");
                setTimeout(() => { banner.style.display = 'none'; }, 2000);
                return;
            }

            try {
                banner.style.display = 'block';
                banner.className = 'status-syncing';
                banner.innerText = `Sincronizando ${llavesRegCap.length} lote(s) con prefijo RegCap...`;

                // Agregamos un delay artificial para que se alcance a leer el cartel amarillo
                await new Promise(resolve => setTimeout(resolve, 2500));

                let sincronizadosConExito = 0;

                // Procesamos dinámicamente cada lote encontrado
                for (const llave of llavesRegCap) {
                    const contenido = localStorage.getItem(llave);
                    if (!contenido) continue;

                    const loteData = JSON.parse(contenido);
                    console.log(`Procesando e impactando en backend [${llave}]:`, loteData);

                    // Simulación de la petición POST al backend Django (Fetch API)
                    // En producción real: await fetch('/api/sincronizar/', { method: 'POST', body: JSON.stringify(loteData) })
                    const respuestaBackendOk = true; 

                    if (respuestaBackendOk) {
                        // CRITERIO DE ACEPTACIÓN 1 (Final): Eliminar la llave procesada
                        localStorage.removeItem(llave);
                        sincronizadosConExito++;
                        console.log(`Llave temporal [${llave}] eliminada de LocalStorage.`);
                    }
                }

                if (sincronizadosConExito > 0) {
                    // CRITERIO 3: Estado cambia a sincronización completada
                    banner.className = 'status-success';
                    banner.innerText = `Sincronización completada: ${sincronizadosConExito} lote(s) procesado(s).`;

                    // Ocultamos el cartel verde después de 4 segundos
                    setTimeout(() => {
                        banner.style.display = 'none';
                    }, 4000);
                }

            } catch (error) {
                banner.className = 'status-offline';
                banner.innerText = 'Error en el servidor. Se reintentará luego.';
            }
        }

        // CRITERIO DE ACEPTACIÓN 2: Eliminar objetos mock con 'dni' y reemplazar por 7 campos + CUIL
        function simularGuardadoOffline() {
            const idUnico = Date.now();
            const llaveDinamica = `RegCap_${idUnico}`;
            
            // Estructura real del sistema (CUIL de 11 dígitos + 7 campos obligatorios)
            const registroCapacitacionReal = {
                cuil: "20351234567",
                apellido: "Gómez",
                nombre: "María",
                profesion: "Enfermera",
                categoria: "Planta Permanente",
                tipo_usuario: "Hospitalario",
                servicio: "Pediatría",
                area: "Cuidados Intensivos"
            };

            localStorage.setItem(llaveDinamica, JSON.stringify(registroCapacitacionReal));
            alert(`Registro guardado en LocalStorage con la llave dinámica:\n${llaveDinamica}\n\nEstructura: CUIL + 7 campos obligatorios.`);
        }
    </script>
</body>
</html>
