<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Capacitación</title>
    <style>
        /* Diseño Mobile-First */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 60px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        input:focus, select:focus { border-color: #007bff; outline: none; }
        
        /* Mensajes de validación en tiempo real */
        .feedback { font-size: 13px; margin-top: 5px; display: none; }
        .error { color: #dc3545; display: block; }
        .success { color: #28a745; display: block; }
        
        .btn-submit { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn-submit:disabled { background-color: #a0c4ff; cursor: not-allowed; }

        /* Estilos del Toast (Notificación flotante) */
        #toast-container {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }
        #toast-container.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
        #toast-container.success-toast { background-color: #28a745; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registro de Asistencia</h2>
        <!-- Formulario con los 7 campos obligatorios -->
        <form id="registroForm">
            
            <div class="form-group">
                <label for="cuil">CUIL (11 dígitos, sin guiones)</label>
                <input type="number" id="cuil" name="cuil" required placeholder="Ej: 20381234567">
                <span id="cuil-feedback" class="feedback"></span>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="Ej: asistente@hospital.com">
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" name="matricula" required placeholder="Ej: MN 12345">
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="">Seleccione su rol...</option>
                    <option value="medico">Médico</option>
                    <option value="enfermero">Enfermería</option>
                    <option value="administrativo">Administrativo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="servicio">Servicio / Hospital</label>
                <input type="text" id="servicio" name="servicio" required placeholder="Ej: Terapia Intensiva">
            </div>

            <div class="form-group">
                <label for="permisos">Permisos</label>
                <select id="permisos" name="permisos" required>
                    <option value="">Seleccione nivel de acceso...</option>
                    <option value="acceso_nivel_1">Acceso Nivel 1 (Básico)</option>
                    <option value="acceso_nivel_2">Acceso Nivel 2 (Intermedio)</option>
                    <option value="acceso_nivel_3">Acceso Nivel 3 (Total)</option>
                </select>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit" disabled>Registrar Asistencia</button>
        </form>
    </div>

    <!-- Contenedor del Toast -->
    <div id="toast-container">Mensaje del toast</div>

    <script>
        const inputCuil = document.getElementById('cuil');
        const cuilFeedback = document.getElementById('cuil-feedback');
        const btnSubmit = document.getElementById('btn-submit');
        const form = document.getElementById('registroForm');
        const toast = document.getElementById('toast-container');

        // Función para mostrar el Toast en lugar del alert()
        function mostrarToast(mensaje, tipo) {
            toast.textContent = mensaje;
            if (tipo === 'success') {
                toast.className = "success-toast show";
            } else {
                toast.className = "show"; // Gris oscuro por defecto
            }
            
            // Ocultar después de 3.5 segundos
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 3500);
        }

        // Validación asíncrona adaptada para CUIL (11 dígitos)
        inputCuil.addEventListener('blur', async () => {
            const cuilValue = inputCuil.value.trim();
            
            if (cuilValue.length !== 11) {
                cuilFeedback.textContent = "El CUIL debe tener exactamente 11 dígitos.";
                cuilFeedback.className = "feedback error";
                btnSubmit.disabled = true;
                return;
            }

            cuilFeedback.textContent = "Validando CUIL...";
            cuilFeedback.className = "feedback";
            cuilFeedback.style.display = "block";
            cuilFeedback.style.color = "#666";

            try {
                // Simulación de latencia de red
                await new Promise(resolve => setTimeout(resolve, 800)); 
                
                // Simulación de base de datos
                const cuilesYaRegistrados = ["20111111112", "27222222223", "20381234567"];
                const existe = cuilesYaRegistrados.includes(cuilValue);

                if (existe) {
                    cuilFeedback.textContent = "Error: Este CUIL ya registró asistencia hoy.";
                    cuilFeedback.className = "feedback error";
                    btnSubmit.disabled = true; 
                } else {
                    cuilFeedback.textContent = "CUIL habilitado.";
                    cuilFeedback.className = "feedback success";
                    btnSubmit.disabled = false; 
                }
            } catch (error) {
                cuilFeedback.textContent = "Error de conexión al validar.";
                cuilFeedback.className = "feedback error";
            }
        });

        // Envío del formulario
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Dispara el Toast en vez del alert()
            mostrarToast("¡Asistencia registrada con éxito en MySQL!", "success");
            
            // Limpia el formulario y bloquea el botón
            form.reset();
            btnSubmit.disabled = true;
            cuilFeedback.style.display = "none";
        });
    </script>
</body>
</html>
